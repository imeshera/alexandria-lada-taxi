# u0,v0 = pixel (from top-left) on the model origin: x = 0 (front bumper face), y = 0 (ground).
CANVASES = [
    # Factory dimensioned 4-view (carblueprints 1109x717), side view cropped (40,40)-(720,300), height x1.02318 to make
