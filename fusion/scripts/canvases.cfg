    ('Factory side view', 'factory_side_iso.png', 'side', 1500, 3.365, 88.0, 501.4, 1360, 532),
    # 2006 Commons side photo, mirrored (front left); wheelbase-scaled (916 px = 2424 mm); front axle px 1492 -> u 428
